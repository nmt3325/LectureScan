name: Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-main
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build and publish unsigned device IPA
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_NAME: LectureScan
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      ARTIFACT_DIR: ${{ github.workspace }}/build/artifacts
      SOURCE_BRANCH: altstore-source
      SOURCE_URL: https://raw.githubusercontent.com/nmt3325/LectureScan/altstore-source/altstore-source.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            echo "::notice::Xcode 26.6 is unavailable; using the runner default."
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve build metadata
        run: |
          set -euo pipefail
          version=$(xcodebuild \
            -project LectureScan.xcodeproj \
            -scheme LectureScan \
            -configuration Release \
            -showBuildSettings | awk '/ MARKETING_VERSION = / { print $3; exit }')
          test -n "$version"

          immutable_ipa_name="$APP_NAME-unsigned-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ID.ipa"
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/$immutable_ipa_name"
          {
            echo "MARKETING_VERSION=$version"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            echo "RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "IMMUTABLE_IPA_NAME=$immutable_ipa_name"
            echo "DOWNLOAD_URL=$download_url"
          } >> "$GITHUB_ENV"

      - name: Build unsigned app for iPhoneOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project LectureScan.xcodeproj \
            -scheme LectureScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            clean build \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          app_path="$DERIVED_DATA/Build/Products/Release-iphoneos/$APP_NAME.app"
          ipa_path="$ARTIFACT_DIR/$APP_NAME-unsigned.ipa"

          test -d "$app_path"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/Payload"
          ditto "$app_path" "$ARTIFACT_DIR/Payload/$APP_NAME.app"
          rm -rf "$ARTIFACT_DIR/Payload/$APP_NAME.app/_CodeSignature"
          rm -f "$ARTIFACT_DIR/Payload/$APP_NAME.app/embedded.mobileprovision"

          if codesign -dv "$ARTIFACT_DIR/Payload/$APP_NAME.app" 2>/dev/null; then
            echo "::error::The packaged application is unexpectedly code signed."
            exit 1
          fi

          (
            cd "$ARTIFACT_DIR"
            /usr/bin/zip -qry "$ipa_path" Payload
            /usr/bin/shasum -a 256 "$APP_NAME-unsigned.ipa" > "$APP_NAME-unsigned.ipa.sha256"
          )
          cp "$ipa_path" "$ARTIFACT_DIR/$IMMUTABLE_IPA_NAME"
          /usr/bin/unzip -t "$ipa_path"
          echo "IPA_SIZE=$(stat -f%z "$ipa_path")" >> "$GITHUB_ENV"

      - name: Generate AltStore and LiveContainer source
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_altstore_source.py \
            --output "$ARTIFACT_DIR/altstore-source.json" \
            --version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --size "$IPA_SIZE" \
            --download-url "$DOWNLOAD_URL" \
            --commit "$GITHUB_SHA" \
            --date "$RELEASED_AT"
          python3 -m json.tool "$ARTIFACT_DIR/altstore-source.json" >/dev/null

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: LectureScan-unsigned-${{ github.sha }}
          path: |
            build/artifacts/LectureScan-unsigned.ipa
            build/artifacts/LectureScan-unsigned.ipa.sha256
            build/artifacts/altstore-source.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

          cat > "$ARTIFACT_DIR/release-notes.md" <<EOF
          Automated unsigned build from commit [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).

          - Version: $MARKETING_VERSION ($BUILD_NUMBER)
          - AltStore / SideStore / LiveContainer source: $SOURCE_URL
          - Source-selected immutable IPA: $DOWNLOAD_URL
          - The canonical LectureScan-unsigned.ipa is also replaced for manual downloads.
          - The IPA is unsigned and intended for re-signing or LiveContainer import.
          EOF

          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title "LectureScan Nightly" \
              --notes-file "$ARTIFACT_DIR/release-notes.md" \
              --prerelease
          else
            gh release create nightly \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "LectureScan Nightly" \
              --notes-file "$ARTIFACT_DIR/release-notes.md" \
              --prerelease
          fi

          gh release upload nightly \
            "$ARTIFACT_DIR/LectureScan-unsigned.ipa" \
            "$ARTIFACT_DIR/LectureScan-unsigned.ipa.sha256" \
            "$ARTIFACT_DIR/$IMMUTABLE_IPA_NAME" \
            "$ARTIFACT_DIR/altstore-source.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release view nightly \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' > "$ARTIFACT_DIR/release-assets.txt"
          grep -Fx "$IMMUTABLE_IPA_NAME" "$ARTIFACT_DIR/release-assets.txt"

      - name: Publish fixed AltStore source URL
        run: |
          set -euo pipefail

          parent=""
          if git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH"
            parent=$(git rev-parse FETCH_HEAD)
          fi

          blob=$(git hash-object -w "$ARTIFACT_DIR/altstore-source.json")
          tree=$(printf '100644 blob %s\taltstore-source.json\n' "$blob" | git mktree)
          message="Update AltStore source for build $BUILD_NUMBER ($GITHUB_SHA)"

          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="$RELEASED_AT"
          export GIT_COMMITTER_DATE="$RELEASED_AT"

          if [[ -n "$parent" ]]; then
            source_commit=$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$parent")
          else
            source_commit=$(printf '%s\n' "$message" | git commit-tree "$tree")
          fi
          git push origin "$source_commit:refs/heads/$SOURCE_BRANCH"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Verify fixed source selects this build
        run: |
          set -euo pipefail
          published_source="$ARTIFACT_DIR/published-altstore-source.json"
          verified=false

          for attempt in {1..12}; do
            if curl -fsSL \
              -H 'Cache-Control: no-cache' \
              "$SOURCE_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              -o "$published_source" \
              && python3 - "$published_source" "$DOWNLOAD_URL" "$BUILD_NUMBER" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          source_path, expected_url, expected_build, expected_commit = sys.argv[1:]
          with open(source_path, encoding="utf-8") as handle:
              source = json.load(handle)
          app = source["apps"][0]
          version = app["versions"][0]
          assert app["downloadURL"] == expected_url
          assert version["downloadURL"] == expected_url
          assert version["buildNumber"] == expected_build
          assert expected_commit[:7] in version["localizedDescription"]
          PY
            then
              verified=true
              break
            fi
            sleep 5
          done

          if [[ "$verified" != true ]]; then
            echo "::error::The fixed source URL did not publish this workflow's immutable IPA."
            exit 1
          fi
          echo "Published source commit: $SOURCE_COMMIT"
          echo "Published immutable IPA: $DOWNLOAD_URL"
