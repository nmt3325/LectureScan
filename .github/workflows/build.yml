name: Build

# macOS hosted runners consume billable minutes for private repositories.
# Run this workflow manually after enabling an Actions spending limit.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project LectureScan.xcodeproj \
            -scheme LectureScan \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO
