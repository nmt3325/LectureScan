name: LectureScan
options:
  bundleIdPrefix: dev.nmt3325
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_APPINTENTS_METADATA_COLLECTION: NO
targets:
  LectureScan:
    type: application
    platform: iOS
    sources:
      - path: LectureScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nmt3325.LectureScan
        PRODUCT_NAME: LectureScan
        INFOPLIST_FILE: LectureScan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - LectureScanTests
  LectureScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LectureScanTests
    dependencies:
      - target: LectureScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nmt3325.LectureScanTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
